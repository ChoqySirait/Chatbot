name: SecurAI CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Test Suite (Pytest Offline)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Automated Pytest Suite
        run: |
          pytest -v

  frontend-build:
    name: Frontend Lint, Typecheck & Build (React + Vite + TS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint Frontend (oxlint)
        run: |
          cd frontend
          npm run lint

      - name: Typecheck Frontend (tsc)
        run: |
          cd frontend
          npx tsc -b --noEmit

      - name: Run Frontend Unit Tests (Vitest)
        run: |
          cd frontend
          npm run test

      - name: Build Frontend Application
        run: |
          cd frontend
          npm run build

      - name: Verify Frontend Asset Size Budgets (REL-07)
        run: |
          cd frontend
          npm run check:budget
